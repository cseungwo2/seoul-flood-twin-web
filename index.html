<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>REDI Twin</title>
<meta name="theme-color" content="#F2EEE7">
<link rel="icon" type="image/png" href="icon.png"><!-- 고려대 호랑이(문장에서 호랑이만, 크림슨) -->
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="css/twin.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<header class="top">
  <h1 class="sr">서울 침수 안전 마진 디지털 트윈</h1>
  <dl class="kpi" aria-live="polite">
    <div><dt>대피 필요 자치구</dt><dd><b id="k-alert">0</b><span>개 구</span></dd></div>
    <div><dt>즉시 대피 자치구</dt><dd><b id="k-late">0</b><span>개 구</span></dd></div>
    <div><dt>대피 인원</dt><dd><b id="k-people">0</b><span>명</span></dd></div>
    <div><dt>대응 자원 회복 인원</dt><dd><b id="k-saved">0</b><span>명</span></dd></div>
  </dl>
  <dl class="kpi wx" id="wx" hidden aria-live="polite">
    <div><dt id="wx-date"></dt><dd><b id="wx-time"></b></dd></div>
    <div><dt>서울 기온</dt><dd><b id="wx-temp"></b><span>℃</span></dd></div>
    <div><dt>현재 강우량</dt><dd><b id="wx-rain"></b><span>mm/h</span></dd></div>
    <div class="wx-act"><button type="button" id="wx-apply">실제 강우 적용</button></div>
  </dl>
</header>

<main class="grid">
  <aside class="panel left" aria-label="조건">
    <details class="sec sec-rain" open>
      <summary>강우</summary>
      <div class="rain-read"><output id="o-rain" for="s-rain">0</output><span>mm/h</span></div>
      <input id="s-rain" type="range" min="0" max="174" step="1" value="0" aria-label="시간당 강우(mm/h)">
      <div class="scale"><span>0 mm/h</span><span>174 mm/h</span></div>
      <div class="quick">
        <button type="button" data-rain="100"><b>100</b> mm/h</button>
        <button type="button" data-rain="174"><b>174</b> mm/h</button>
      </div>
    </details>
    <div id="res"></div>
    <section class="sit" aria-label="상황 알림">
      <div class="sec grp">상황 알림</div>
      <ol class="sit-list" id="sit-list"></ol>
    </section>
  </aside>
  <div class="gutter" data-side="left" role="separator" aria-orientation="vertical" aria-label="왼쪽 패널 폭" tabindex="0"><button type="button" class="fold" aria-label="왼쪽 패널 접기">‹</button></div>

  <section class="mapwrap" aria-label="서울 지도">
    <div id="map"></div>
    <canvas class="rain" id="rain" aria-hidden="true"></canvas>
    <div class="mapbtns"><!-- 지도 버튼은 오른쪽 위에 모음 -->
      <button type="button" class="mapback" id="mapback" hidden>서울 전체</button>
      <button type="button" class="routebtn" id="route-btn" aria-pressed="false" hidden>대피 경로</button>
    </div>
    <div class="routecard" id="route-card" hidden aria-live="polite"></div>
    <p class="mapfail" id="mapfail" hidden>지도를 불러오지 못했습니다 — 계산 결과는 그대로 볼 수 있습니다</p>
    <details class="legend" id="legend">
      <summary>범례</summary>
      <section class="lgs" id="lg-zone" hidden>
        <p class="lgt">예상 피해 지역</p>
        <div class="zchips" id="lg-zone-c"></div>
      </section>
      <section class="lgs">
        <p class="lgt">침수 수심</p>
        <div class="ramp"><i class="w1"></i><i class="w2"></i><i class="w3"></i></div>
        <div class="ramp-l"><span>0.15 ~ 0.3 m</span><span>0.3 ~ 0.5 m</span><span>0.5 m 이상</span></div>
      </section>
      <section class="lgs" id="lg-shelter"><div class="lg"><i class="dot"></i>대피시설</div></section>
    </details>
  </section>
  <div class="gutter" data-side="right" role="separator" aria-orientation="vertical" aria-label="오른쪽 패널 폭" tabindex="0"><button type="button" class="fold" aria-label="오른쪽 패널 접기">›</button></div>

  <aside class="panel right" aria-label="선택 구">
    <div class="guhead">
      <label for="s-gu" class="sr">자치구 선택</label>
      <select id="s-gu"></select>
      <p id="gu-count" class="gucount"></p>
    </div>
    <p class="pick" id="gu-pick" hidden></p>
    <details class="sec sec-say" open>
      <summary>시민 유형별 대피 경보</summary>
      <ol id="lines" class="lines"></ol>
    </details>
    <details class="sec sec-arsm" open>
      <summary>안전 마진</summary>
      <ul class="alg" id="arsm-lg"></ul>
      <div class="chartbox" id="arsm-box"><canvas id="c-arsm" aria-label="강우에 따른 시민 유형별 ARSM 곡선"></canvas></div>
      <p class="na" id="arsm-na" hidden>정보 없음</p>
    </details>
  </aside>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script type="module" src="js/app.js"></script>
</body>
</html>
